name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: test before release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Test
        run: go test -count=1 ./...
      - name: Vet
        run: go vet ./...
      - name: nowhere-check
        run: go run ./cmd/nowhere-check
      - name: Test Portal/Vector CLI
        run: cd cmd/nowhere && GOWORK=off go test ./...

  dist:
    name: Portal/Vector linux / windows / darwin binaries
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true
      - name: Version
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - name: Cross-compile
        run: make dist VERSION=${{ steps.meta.outputs.version }}
      - name: List artifacts
        run: ls -l dist && cat dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nowhere-check-${{ steps.meta.outputs.version }}
          path: dist/
          if-no-files-found: error
      - name: GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true
